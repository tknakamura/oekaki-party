<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ff6b4a" />
<title>おえかき宴会バトル</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="おえかき宴会" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fff6e9;
    --ink: #2b2118;
    --sub: #8a7a6a;
    --accent: #ff6b4a;
    --accent2: #ffc83d;
    --ok: #2bb673;
    --card: #ffffff;
    --line: #2b2118;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "M PLUS Rounded 1c", system-ui, -apple-system, "Hiragino Maru Gothic ProN", sans-serif; }
  body { background-image: radial-gradient(#f3dcc0 1.2px, transparent 1.2px); background-size: 18px 18px; }
  #app { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); min-height: 100%; }
  .hint { background: #fff; border: 3px dashed var(--line); border-radius: 16px; padding: 12px 40px 12px 14px;
    margin-bottom: 16px; position: relative; font-size: 14px; line-height: 1.6; }
  .hint b { font-size: 15px; }
  .hint .x { position: absolute; right: 8px; top: 6px; border: none; background: none; font-size: 20px; color: var(--sub); cursor: pointer; }
  .share-ico { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; }
  h1 { font-weight: 800; font-size: 30px; line-height: 1.15; margin: 18px 0 4px; text-align: center; }
  h1 .tilt { display: inline-block; background: var(--accent2); padding: 2px 10px; border: 3px solid var(--line);
    border-radius: 12px; transform: rotate(-3deg); box-shadow: 3px 3px 0 var(--line); }
  h2 { font-size: 20px; margin: 4px 0 12px; font-weight: 800; }
  .lead { text-align: center; color: var(--sub); margin: 10px 0 22px; font-size: 14px; }
  .card { background: var(--card); border: 3px solid var(--line); border-radius: 18px; padding: 16px;
    box-shadow: 4px 4px 0 var(--line); margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; font-weight: 800; }
  input, select { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border: 3px solid var(--line);
    border-radius: 12px; background: #fff; color: var(--ink); outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  .btn { display: block; width: 100%; font: inherit; font-weight: 800; font-size: 18px; padding: 14px;
    border: 3px solid var(--line); border-radius: 14px; background: var(--accent); color: #fff; cursor: pointer;
    box-shadow: 0 4px 0 var(--line); transition: transform .05s, box-shadow .05s; margin-top: 12px; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .btn.alt { background: #fff; color: var(--ink); }
  .btn.yellow { background: var(--accent2); color: var(--ink); }
  .btn.small { font-size: 14px; padding: 9px; margin-top: 8px; }
  .btn:disabled { opacity: .45; pointer-events: none; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .divider { text-align: center; color: var(--sub); margin: 14px 0 4px; font-size: 13px; }
  .code { font-size: 44px; font-weight: 800; letter-spacing: 8px; text-align: center; margin: 2px 0; }
  .qr { display: block; margin: 8px auto 0; width: 200px; height: 200px; background: #fff; border-radius: 10px; }
  .muted { color: var(--sub); font-size: 13px; }
  .center { text-align: center; }
  .players { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .players li { border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px; background: #fff;
    font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .players li.off { opacity: .4; }
  .players li.done { background: #dff6ea; }
  .badge { font-size: 11px; background: var(--accent2); border: 2px solid var(--line); border-radius: 8px; padding: 0 5px; }
  .kick { border: none; background: none; font-size: 15px; color: var(--sub); padding: 0 0 0 2px; cursor: pointer; }
  .prompt-box { background: var(--accent2); border: 3px solid var(--line); border-radius: 16px; padding: 10px 14px;
    text-align: center; box-shadow: 3px 3px 0 var(--line); margin-bottom: 12px; }
  .prompt-box small { display: block; font-size: 12px; font-weight: 800; }
  .prompt-box b { font-size: 24px; line-height: 1.3; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-weight: 800; }
  .timer { font-size: 22px; min-width: 64px; text-align: center; border: 3px solid var(--line); border-radius: 12px;
    background: #fff; padding: 2px 8px; }
  .timer.hurry { background: var(--accent); color: #fff; animation: pulse .6s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }
  .canvas-wrap { border: 3px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff;
    box-shadow: 4px 4px 0 var(--line); touch-action: none; }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  .canvas-wrap, canvas, .tools, .entry, .entry img, .rank img {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body.drawing { -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; justify-content: center; }
  .swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--line); cursor: pointer; padding: 0; }
  .swatch.sel { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tool { border: 3px solid var(--line); background: #fff; border-radius: 12px; height: 40px; min-width: 44px;
    font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; padding: 0 10px; color: var(--ink); }
  .tool.sel { background: var(--accent2); }
  .dot { display: inline-block; background: var(--ink); border-radius: 50%; vertical-align: middle; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .entry { position: relative; border: 3px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff;
    cursor: pointer; box-shadow: 3px 3px 0 var(--line); padding: 0; }
  .entry img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; }
  .entry.mine { opacity: .5; cursor: default; }
  .entry .tag { position: absolute; left: 6px; top: 6px; background: var(--line); color: #fff; font-size: 11px;
    border-radius: 8px; padding: 2px 6px; font-weight: 800; }
  .entry.sel { outline: 5px solid var(--accent); outline-offset: -2px; }
  .entry.sel::after { content: "これに投票"; position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; font-weight: 800; font-size: 12px; padding: 3px 8px; border-radius: 8px; white-space: nowrap; }
  .rank { display: flex; gap: 12px; align-items: center; border: 3px solid var(--line); border-radius: 14px;
    background: #fff; padding: 8px; margin-bottom: 10px; box-shadow: 3px 3px 0 var(--line); }
  .rank img { width: 96px; height: 96px; object-fit: contain; border-radius: 8px; border: 2px solid #eee; flex: none; }
  .rank.first { background: #fff4cc; }
  .rank.first img { width: 100%; height: auto; aspect-ratio: 1; }
  .rank.first { flex-direction: column; align-items: stretch; }
  .rank .who { font-weight: 800; font-size: 18px; }
  .rank .pts { color: var(--accent); font-weight: 800; }
  .medal { font-size: 26px; }
  .score-list { list-style: none; padding: 0; margin: 0; }
  .score-list li { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 2px dashed #e8d9c6; font-weight: 800; }
  .score-list li:last-child { border-bottom: 0; }
  .waiting { text-align: center; padding: 26px 10px; }
  .big-emoji { font-size: 56px; animation: bob 1.2s ease-in-out infinite; display: inline-block; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(6deg); } }
  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 800; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }
  #conn { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; background: var(--accent); color: #fff; text-align: center;
    font-size: 13px; font-weight: 800; padding: 4px; display: none; z-index: 20; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center;
    justify-content: center; z-index: 30; padding: 16px; }
  #lightbox img { max-width: 100%; max-height: 80vh; background: #fff; border-radius: 12px; }
  .rankchip { border: 3px solid var(--line); background: #fff; border-radius: 12px; font: inherit; font-weight: 800;
    font-size: 14px; padding: 5px 10px; cursor: pointer; color: var(--ink); box-shadow: 2px 2px 0 var(--line); }
  .rankchip b { color: var(--accent); }
  #sheet { position: fixed; inset: 0; background: rgba(43,33,24,.55); display: none; align-items: flex-end;
    justify-content: center; z-index: 35; }
  #sheet .panel { background: var(--bg); width: 100%; max-width: 560px; max-height: 85vh; overflow: auto;
    border-top: 3px solid var(--line); border-radius: 20px 20px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
  .stand { width: 100%; border-collapse: collapse; font-weight: 800; }
  .stand td { padding: 9px 4px; border-bottom: 2px dashed #e8d9c6; }
  .stand tr:last-child td { border-bottom: 0; }
  .stand tr.me td { background: #fff4cc; }
  .stand .rk { width: 42px; font-size: 18px; text-align: center; }
  .stand .sc { text-align: right; white-space: nowrap; }
  .stand .dl { font-size: 12px; color: var(--ok); display: block; }
  .mv { font-size: 11px; margin-left: 4px; }
  .mv.up { color: var(--ok); } .mv.down { color: var(--accent); } .mv.same { color: var(--sub); }
  .tally-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tally { border-collapse: collapse; font-weight: 800; font-size: 14px; min-width: 100%; }
  .tally th, .tally td { padding: 7px 8px; text-align: center; border-bottom: 2px solid #eee2d2; white-space: nowrap; }
  .tally th { font-size: 12px; color: var(--sub); }
  .tally td.nm { text-align: left; position: sticky; left: 0; background: #fff; max-width: 7em; overflow: hidden; text-overflow: ellipsis; }
  .tally td.tot { color: var(--accent); }
  .tally td.best { background: #fff4cc; }
  .bonus { background: var(--accent); color: #fff; border: 3px solid var(--line); border-radius: 12px; text-align: center;
    font-weight: 800; padding: 6px 10px; margin-bottom: 10px; box-shadow: 3px 3px 0 var(--line); animation: pulse .7s infinite alternate; }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-weight: 800; font-size: 15px; color: var(--ink); }
  .check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 40; pointer-events: none;
    animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<div id="conn">接続が切れました。再接続中…</div>
<div id="app"></div>
<div id="toast"></div>
<div id="lightbox"><img alt="" /></div>
<div id="sheet"><div class="panel" id="sheetPanel"></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $app = document.getElementById("app");
const socket = io({ reconnectionDelayMax: 3000 });
let S = null;            // サーバーからの状態
let clockOffset = 0;     // サーバー時計との差
let session = loadSession();
let drawingSubmittedRound = 0;
let lastRenderedKey = "";
let selectedEntry = null;
const params = new URLSearchParams(location.search);
const urlRoom = (params.get("room") || "").toUpperCase();

function loadSession() { try { return JSON.parse(localStorage.getItem("oekaki-session") || "null"); } catch { return null; } }
function saveSession(s) { session = s; try { s ? localStorage.setItem("oekaki-session", JSON.stringify(s)) : localStorage.removeItem("oekaki-session"); } catch {} }
function savedName() { try { return localStorage.getItem("oekaki-name") || ""; } catch { return ""; } }
function rememberName(n) { try { localStorage.setItem("oekaki-name", n); } catch {} }
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const me = () => S && S.players.find((p) => p.id === S.me);
const isHost = () => S && S.hostId === S.me;
const nameOf = (id) => (S.players.find((p) => p.id === id) || {}).name || "";

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}

// ---------- アプリっぽく見せる ----------
const UA = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(UA);
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone === true;
const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const canFullscreen = () => isAndroid && !isStandalone() && !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
// Android はボタンを押したタイミングで全画面にする（iPhone の Safari は非対応）
function goFullscreen() {
  if (!canFullscreen() || isFullscreen()) return;
  const el = document.documentElement;
  try {
    const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: "hide" }) : el.webkitRequestFullscreen();
    if (p && p.then) p.then(() => { try { screen.orientation.lock("portrait").catch(() => {}); } catch {} }).catch(() => {});
  } catch {}
}
document.addEventListener("fullscreenchange", () => { if (S && S.phase === "lobby") { lastRenderedKey = ""; render(); } });
const hintDismissed = () => { try { return localStorage.getItem("oekaki-hint-off") === "1"; } catch { return false; } };
function appHint() {
  if (isStandalone()) return "";
  if (isIOS && !hintDismissed()) return `
    <div class="hint" id="hint"><button class="x" id="hintX" aria-label="閉じる">×</button>
      <b>📱 アプリのように全画面で遊べます</b><br>
      Safari 下の <svg class="share-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg> 共有ボタン →「ホーム画面に追加」。追加したアイコンから開いてください</div>`;
  if (canFullscreen() && !isFullscreen()) return `<button class="btn alt small" id="fsBtn" style="margin:0 0 16px">⛶ 全画面にする</button>`;
  return "";
}
function bindAppHint() {
  const x = document.getElementById("hintX");
  if (x) x.onclick = () => { try { localStorage.setItem("oekaki-hint-off", "1"); } catch {} document.getElementById("hint").remove(); };
  const f = document.getElementById("fsBtn");
  if (f) f.onclick = () => { goFullscreen(); f.remove(); };
}
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));

// ---------- 通信 ----------
socket.on("connect", () => {
  document.getElementById("conn").style.display = "none";
  if (session && (!urlRoom || urlRoom === session.code)) socket.emit("resume", session);
  else if (!S && lastRenderedKey !== "home") render();
});
socket.on("disconnect", () => { if (S) document.getElementById("conn").style.display = "block"; });
socket.on("resumeFailed", () => { saveSession(null); S = null; render(); });
socket.on("joined", ({ code, playerId, token }) => {
  saveSession({ code, token });
  history.replaceState(null, "", "/?room=" + code);
});
const imgCache = new Map();
function fillImages(list) {
  for (const x of list || []) {
    if (x.image) imgCache.set(x.imgKey, x.image);
    else x.image = imgCache.get(x.imgKey) || "";
  }
}
socket.on("state", (st) => {
  fillImages(st.entries);
  if (st.result) fillImages(st.result.ranking);
  clockOffset = st.now - Date.now();
  const prevPhase = S && S.phase;
  S = st;
  if (prevPhase !== S.phase) { lastRenderedKey = ""; selectedEntry = null; closeStandings(); }
  render();
});
socket.on("errorMsg", toast);
socket.on("kicked", () => { saveSession(null); S = null; toast("ルームから外れました"); render(); });

// ---------- 画面 ----------
function render() {
  document.body.classList.toggle("drawing", !!S && S.phase === "drawing");
  if (!S) return renderHome();
  const fn = { lobby: renderLobby, drawing: renderDrawing, voting: renderVoting, results: renderResults, final: renderFinal }[S.phase];
  fn();
}

// ---------- 順位 ----------
// 直近に結果が出たラウンド（描画中・投票中は1つ前）
function lastScoredRound() { return (S.phase === "results" || S.phase === "final") ? S.round : S.round - 1; }
function standings() {
  const r = lastScoredRound();
  const withPrev = S.players.map((p) => {
    const delta = r > 0 ? (p.history[r] || 0) : 0;
    return { ...p, delta, prev: p.score - delta };
  });
  const rankBy = (key) => {
    const sorted = [...withPrev].sort((a, b) => b[key] - a[key]);
    const m = new Map(); sorted.forEach((p, i) => m.set(p.id, i > 0 && sorted[i - 1][key] === p[key] ? m.get(sorted[i - 1].id) : i + 1));
    return m;
  };
  const now = rankBy("score"), before = rankBy("prev");
  return withPrev.map((p) => ({ ...p, rank: now.get(p.id), prevRank: before.get(p.id) }))
    .sort((a, b) => a.rank - b.rank || a.name.localeCompare(b.name));
}
function moveMark(p) {
  if (lastScoredRound() < 2) return "";
  const d = p.prevRank - p.rank;
  if (d > 0) return `<span class="mv up">▲${d}</span>`;
  if (d < 0) return `<span class="mv down">▼${-d}</span>`;
  return `<span class="mv same">―</span>`;
}
function standingsTable() {
  const medals = { 1: "🥇", 2: "🥈", 3: "🥉" };
  const showDelta = lastScoredRound() > 0;
  return `<table class="stand">${standings().map((p) => `
    <tr class="${p.id === S.me ? "me" : ""}">
      <td class="rk">${p.score > 0 && medals[p.rank] ? medals[p.rank] : p.rank}</td>
      <td>${esc(p.name)}${p.id === S.me ? ' <span class="muted">(あなた)</span>' : ""}${moveMark(p)}</td>
      <td class="sc">${p.score}点${showDelta && p.delta ? `<span class="dl">+${p.delta}</span>` : ""}</td>
    </tr>`).join("")}</table>`;
}
function isBonusRound() { return S.settings.doubleFinal && S.settings.rounds >= 2 && S.round === S.settings.rounds; }
function bonusBanner() { return isBonusRound() ? '<div class="bonus">🔥 最終ラウンド！得点2倍 🔥</div>' : ""; }
function rankChip() {
  const mine = standings().find((p) => p.id === S.me);
  const label = lastScoredRound() > 0 && mine ? `🏆 <b>${mine.rank}位</b>/${S.players.length}人` : "🏆 順位";
  return `<button class="rankchip" data-standings>ラウンド ${S.round}/${S.settings.rounds}・${label}</button>`;
}
function bindRankChip() { $app.querySelectorAll("[data-standings]").forEach((b) => b.onclick = openStandings); }
function openStandings() {
  const r = lastScoredRound();
  document.getElementById("sheetPanel").innerHTML = `
    <h2>現在の順位 <span class="muted">${r > 0 ? `${r}ラウンド終了時点` : "まだ得点はありません"}</span></h2>
    ${standingsTable()}
    <p class="muted center">のこり ${Math.max(0, S.settings.rounds - r)} ラウンド</p>
    <button class="btn alt small" id="sheetClose">閉じる</button>`;
  document.getElementById("sheet").style.display = "flex";
  document.getElementById("sheetClose").onclick = closeStandings;
}
function closeStandings() { document.getElementById("sheet").style.display = "none"; }
document.getElementById("sheet").onclick = (e) => { if (e.target.id === "sheet") closeStandings(); };

function tallyTable() {
  const rounds = Array.from({ length: S.round }, (_, i) => i + 1);
  const best = {};
  for (const r of rounds) best[r] = Math.max(0, ...S.players.map((p) => p.history[r] || 0));
  return `<div class="tally-wrap"><table class="tally">
    <tr><th style="text-align:left">名前</th>${rounds.map((r) => `<th>R${r}${S.settings.doubleFinal && S.settings.rounds >= 2 && r === S.settings.rounds ? "<br>×2" : ""}</th>`).join("")}<th>合計</th></tr>
    ${standings().map((p) => `<tr><td class="nm">${p.rank}. ${esc(p.name)}</td>${rounds.map((r) => {
      const v = p.history[r];
      return `<td class="${v && v === best[r] ? "best" : ""}">${v === undefined ? "-" : v}</td>`;
    }).join("")}<td class="tot">${p.score}</td></tr>`).join("")}
  </table></div><p class="muted" style="margin:8px 0 0">黄色はそのラウンドの最高得点。横にスクロールできます</p>`;
}

function renderHome() {
  lastRenderedKey = "home";
  const joining = !!urlRoom;
  $app.innerHTML = `
    <h1>おえかき<br><span class="tilt">宴会バトル</span></h1>

// 描画は 640×640 の仮想座標で記録し、画面の細かさに合わせた解像度で描く
const VIRT = 640;
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];

function fitCanvas() {
  const cv = pad.canvas; if (!cv || !cv.isConnected) return;
  const cssW = cv.getBoundingClientRect().width || 320;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const px = Math.min(1600, Math.round(cssW * dpr));
  if (cv.width !== px) { cv.width = px; cv.height = px; }
  pad.scale = px / VIRT;
  pad.ctx.setTransform(pad.scale, 0, 0, pad.scale, 0, 0);
  redraw();
}

function setupCanvas() {
  const cv = document.getElementById("cv");
  pad.canvas = cv; pad.ctx = cv.getContext("2d", { alpha: false, desynchronized: true }) || cv.getContext("2d");
  fitCanvas();
  const pos = (e, r) => [(e.clientX - r.left) * VIRT / r.width, (e.clientY - r.top) * VIRT / r.height];
  let rect = null, raf = 0, pointerId = null;
  const flush = () => { raf = 0; if (pad.current) drawSegments(pad.current); };

  cv.addEventListener("pointerdown", (e) => {
    if (pointerId !== null) return; // 2本目の指は無視
    e.preventDefault();
    pointerId = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch {}
    rect = cv.getBoundingClientRect();
    pad.current = { color: pad.color, size: pad.size, pts: [pos(e, rect)], done: 0 };
    pad.strokes.push(pad.current);
    drawDot(pad.current);
  });
  cv.addEventListener("pointermove", (e) => {
    if (!pad.current || e.pointerId !== pointerId) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    const pts = pad.current.pts;
    for (const ev of (evs.length ? evs : [e])) {
      const q = pos(ev, rect), last = pts[pts.length - 1];
      if (Math.hypot(q[0] - last[0], q[1] - last[1]) >= 1.2) pts.push(q); // 細かすぎる揺れは捨てる
    }
    if (!raf) raf = requestAnimationFrame(flush); // 画面の書き換えは1フレームに1回
  });
  const end = (e) => {
    if (e.pointerId !== pointerId) return;
    pointerId = null;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    if (pad.current) { drawSegments(pad.current); drawTail(pad.current); }
    pad.current = null;
  };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);
  // 長押しの拡大鏡・メニュー、スクロールを止める
  cv.addEventListener("contextmenu", (e) => e.preventDefault());
  for (const t of ["touchstart", "touchmove"]) cv.addEventListener(t, (e) => e.preventDefault(), { passive: false });
}
window.addEventListener("resize", () => { if (S && S.phase === "drawing") fitCanvas(); });

function strokeStyle(s) {
  const c = pad.ctx;
  c.strokeStyle = s.color; c.fillStyle = s.color; c.lineWidth = s.size; c.lineCap = "round"; c.lineJoin = "round";
  return c;
}
function drawDot(s) {
  const c = strokeStyle(s), p = s.pts[0];
  c.beginPath(); c.arc(p[0], p[1], s.size / 2, 0, Math.PI * 2); c.fill();
}
// 点と点の中間を通る2次曲線でつなぐ（なめらかな線になる）
function drawSegments(s) {
  const p = s.pts; if (p.length < 2) return;
  const c = strokeStyle(s);
  let i = s.done || 0;
  if (i === 0) { c.beginPath(); c.moveTo(p[0][0], p[0][1]); const m = mid(p[0], p[1]); c.lineTo(m[0], m[1]); c.stroke(); i = 1; }
  if (i > p.length - 2) { s.done = i; return; }
  c.beginPath();
  let m = mid(p[i - 1], p[i]); c.moveTo(m[0], m[1]);
  for (; i <= p.length - 2; i++) { m = mid(p[i], p[i + 1]); c.quadraticCurveTo(p[i][0], p[i][1], m[0], m[1]); }
  c.stroke();
  s.done = i;
}
function drawTail(s) {
  const p = s.pts, n = p.length; if (n < 2) return;
  const c = strokeStyle(s), m = mid(p[n - 2], p[n - 1]);
  c.beginPath(); c.moveTo(m[0], m[1]); c.lineTo(p[n - 1][0], p[n - 1][1]); c.stroke();
}
function drawStroke(s) {
  const p = s.pts;
  if (p.length === 1) return drawDot(s);
  const c = strokeStyle(s);
  c.beginPath(); c.moveTo(p[0][0], p[0][1]);
  let m = mid(p[0], p[1]); c.lineTo(m[0], m[1]);
  for (let i = 1; i < p.length - 1; i++) { m = mid(p[i], p[i + 1]); c.quadraticCurveTo(p[i][0], p[i][1], m[0], m[1]); }
  c.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
  c.stroke();
}
function redraw() {
  if (!pad.ctx) return;
  pad.ctx.fillStyle = "#fff"; pad.ctx.fillRect(0, 0, VIRT, VIRT);
  for (const s of pad.strokes) drawStroke(s);
}
function submitDrawing() {
  if (drawingSubmittedRound === S.round || !pad.canvas) return;
  drawingSubmittedRound = S.round;
  // 送るのは 720px 四方に縮小した画像（通信量を抑える）
  const out = document.createElement("canvas"); out.width = out.height = 720;
  const o = out.getContext("2d"); o.fillStyle = "#fff"; o.fillRect(0, 0, 720, 720);
  o.imageSmoothingQuality = "high"; o.drawImage(pad.canvas, 0, 0, 720, 720);
  socket.emit("submitDrawing", out.toDataURL("image/jpeg", 0.85));
}

  let place = 0, prev = null;

    return `<div class="rank ${first ? "first" : ""}">
      <img src="${x.image}" alt="" data-zoom />
      <div><div class="who">${medals[place] ? `<span class="medal">${medals[place]}</span> ` : ""}${esc(x.name)}${x.playerId === S.me ? " (あなた)" : ""}</div>

    </div>
    <div class="card"><h2>最終順位</h2>${standingsTable()}</div>
    <div class="card"><h2>ラウンドごとの得点</h2>${tallyTable()}</div>
    ${isHost() ? '<button class="btn" id="againBtn">もう一度あそぶ</button>' : '<p class="muted center">幹事がもう一度始めるのを待っています</p>'}`;
  bindZoom();
  confetti(120);
  const a = document.getElementById("againBtn"); if (a) a.onclick = () => socket.emit("backToLobby");
}

function confetti(n) {
  const colors = ["#ff6b4a", "#ffc83d", "#2bb673", "#2d7ff9", "#ff7eb6"];
  for (let i = 0; i < n; i++) {
    const d = document.createElement("div"); d.className = "confetti";
    d.style.left = Math.random() * 100 + "vw"; d.style.background = colors[i % colors.length];
    d.style.animationDuration = 1.8 + Math.random() * 1.8 + "s"; d.style.animationDelay = Math.random() * .6 + "s";
    document.body.appendChild(d); setTimeout(() => d.remove(), 4500);
  }
}

// ---------- タイマー ----------
setInterval(() => {
  const el = document.getElementById("timer");
  if (!S || !S.deadline || !el) return;
  const left = Math.max(0, Math.ceil((S.deadline - (Date.now() + clockOffset)) / 1000));
  el.textContent = left + "秒";
  el.classList.toggle("hurry", left <= 10 && left > 0);
  if (S.phase === "drawing" && left === 0 && !me()?.submitted && pad.strokes.length) submitDrawing(); // 時間切れで自動提出
}, 250);

// 描いている途中のページ戻りを防ぐ
window.addEventListener("beforeunload", (e) => { if (S && S.phase === "drawing" && pad.strokes.length && !me()?.submitted) { e.preventDefault(); e.returnValue = ""; } });
</script>
</body>
